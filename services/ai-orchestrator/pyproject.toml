[project]
name = "xdrama-ai-orchestrator"
version = "0.1.0"
description = "AI orchestration service for XDrama AI Studio — the only component that talks to ComfyUI and GPU render nodes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-jose[cryptography]>=3.3,<4",
  "redis>=5.1,<6",
  "httpx>=0.27,<0.28",
  "supabase>=2.10,<3",
  "modal>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.7,<0.8",
  "mypy>=1.13,<2",
  "types-python-jose>=3.3,<4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
