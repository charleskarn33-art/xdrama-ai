# Reverse proxy for the AI Render Engine's control plane.
#
# ComfyUI render nodes must never be reachable directly from the internet —
# only ai-orchestrator talks to them, over the private Docker/GPU-host
# network. This proxy fronts ai-orchestrator only; it is the single public
# entry point for AI infrastructure traffic.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  keepalive_timeout 65;

  # Render-triggering endpoints are the most expensive thing a client can
  # call — cap request rate here in addition to any app-level limiting.
  limit_req_zone $binary_remote_addr zone=render_limit:10m rate=5r/s;

  upstream ai_orchestrator {
    server ai-orchestrator:8000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /health {
      proxy_pass http://ai_orchestrator/health;
    }

    location /api/ {
      limit_req zone=render_limit burst=10 nodelay;
      proxy_pass http://ai_orchestrator;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
